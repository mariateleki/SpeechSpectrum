<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transcript A - Bullet Points</title>
  <link rel="stylesheet" href="./standalone.css">
</head>
<body>
<div class="instructions">
  <h1>Transcript Evaluation</h1>
  <p>Please read the transcript on the left, then answer the survey questions on the right based on your reading.</p>
</div>
<div class="page-layout">
  <div class="transcript-side">
    <p class="column-header">Transcript</p>
    <div class="card" id="text-content"></div>
  </div>
  <div class="survey-side">
    <p class="column-header">Questions</p>
    <div id="survey-container"></div>
  </div>
</div>
<script src="../questions.js"></script>
<script src="../survey.js"></script>
<script>
  fetch('../transcripts/TranscrA_bullet-points.txt').then(function(r){return r.text();}).then(function(t){document.getElementById('text-content').innerHTML=t;});
</script>
</body>
</html>
