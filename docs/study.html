<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpeechSpectrum Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 0;
  font-family: 'Inter', sans-serif;
  background-color: #F9FAFB;
  color: #111827;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.study-card {
  background: #fff;
  border-radius: 16px;
  padding: 48px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  border: 1px solid #E5E7EB;
  max-width: 460px;
  width: 100%;
  margin: 24px;
  text-align: center;
}
.study-card h1 {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0 0 8px;
  color: #111827;
}
.study-card .subtitle {
  color: #6B7280;
  font-size: 0.95rem;
  margin: 0 0 32px;
  line-height: 1.5;
}
.study-card label {
  display: block;
  text-align: left;
  font-weight: 500;
  font-size: 0.9rem;
  color: #374151;
  margin-bottom: 8px;
}
.study-card input {
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid #D1D5DB;
  border-radius: 8px;
  font-size: 1rem;
  font-family: 'Inter', sans-serif;
  color: #111827;
  outline: none;
  transition: border-color 0.2s ease;
}
.study-card input:focus {
  border-color: #4F46E5;
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}
.study-card button {
  width: 100%;
  padding: 14px;
  background: #4F46E5;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  margin-top: 20px;
  transition: all 0.2s ease;
}
.study-card button:hover {
  background: #4338CA;
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
}
.study-card button:disabled {
  background: #D1D5DB;
  cursor: not-allowed;
  box-shadow: none;
}
.error {
  color: #DC2626;
  font-size: 0.85rem;
  margin-top: 8px;
  display: none;
}
</style>

</head>
<body>

<div class="study-card">
  <h1>Welcome</h1>
  <p class="subtitle">Please enter your Prolific ID to begin.</p>

  <label for="prolific-id">Prolific ID</label>
  <input type="text" id="prolific-id" placeholder="e.g. 5f3a8b2c1d4e..." autocomplete="off" autofocus>
  <p class="error" id="error-msg">Please enter a valid Prolific ID.</p>

  <button id="start-btn" disabled>Start Study</button>
</div>

<script>
(function() {
  // 15 possible conditions
  var conditions = [
    // 12 standalone pages
    { url: './standalone/legal-verbatim.html', label: 'legal-verbatim' },
    { url: './standalone/legal-non-verbatim.html', label: 'legal-non-verbatim' },
    { url: './standalone/legal-enhanced.html', label: 'legal-enhanced' },
    { url: './standalone/legal-bullet-points.html', label: 'legal-bullet-points' },
    { url: './standalone/medical-verbatim.html', label: 'medical-verbatim' },
    { url: './standalone/medical-non-verbatim.html', label: 'medical-non-verbatim' },
    { url: './standalone/medical-enhanced.html', label: 'medical-enhanced' },
    { url: './standalone/medical-bullet-points.html', label: 'medical-bullet-points' },
    { url: './standalone/business-verbatim.html', label: 'business-verbatim' },
    { url: './standalone/business-non-verbatim.html', label: 'business-non-verbatim' },
    { url: './standalone/business-enhanced.html', label: 'business-enhanced' },
    { url: './standalone/business-bullet-points.html', label: 'business-bullet-points' },
    // 3 interactive demos
    { url: './demo.html#legal/0', label: 'demo-legal' },
    { url: './demo.html#medical/0', label: 'demo-medical' },
    { url: './demo.html#business/0', label: 'demo-business' }
  ];

  var input = document.getElementById('prolific-id');
  var btn = document.getElementById('start-btn');
  var errorMsg = document.getElementById('error-msg');

  // Enable button when input has content
  input.addEventListener('input', function() {
    btn.disabled = input.value.trim().length === 0;
    errorMsg.style.display = 'none';
  });

  // Allow Enter key to submit
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !btn.disabled) {
      btn.click();
    }
  });

  btn.addEventListener('click', function() {
    var pid = input.value.trim();

    if (pid.length < 5) {
      errorMsg.style.display = 'block';
      return;
    }

    // Check if this PID already has an assignment
    var storageKey = 'ss_assignment_' + pid;
    var existing = localStorage.getItem(storageKey);
    var condition;

    if (existing) {
      condition = JSON.parse(existing);
    } else {
      // Random assignment
      var index = Math.floor(Math.random() * conditions.length);
      condition = conditions[index];
      localStorage.setItem(storageKey, JSON.stringify(condition));
    }

    // Log study start to Google Sheets
    var SHEETS_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwhr3jb8UFugRfVbtCN7xbcXjiKSOfMEajOjuqYbLv9y4DISunCVqyqNvGl1n2XJKmJ/exec';
    var payload = {
      timestamp: new Date().toISOString(),
      event_type: 'study_start',
      prolific_id: pid,
      assigned_condition: condition.label,
      question_id: '',
      question_text: '',
      response: '',
      extra: ''
    };
    if (SHEETS_WEBHOOK_URL && SHEETS_WEBHOOK_URL !== 'YOUR_APPS_SCRIPT_URL_HERE') {
      navigator.sendBeacon(SHEETS_WEBHOOK_URL, JSON.stringify(payload));
    } else {
      console.log('[SpeechSpectrum log]', payload);
    }

    // Store PID in sessionStorage so destination pages can read it
    sessionStorage.setItem('ss_prolific_id', pid);
    sessionStorage.setItem('ss_condition', condition.label);

    // Redirect to assigned condition
    var separator = condition.url.indexOf('?') >= 0 ? '&' : '?';
    window.location.href = condition.url + separator + 'pid=' + encodeURIComponent(pid);
  });

  // If returning with a PID in URL, check for existing assignment
  var urlParams = new URLSearchParams(window.location.search);
  var urlPid = urlParams.get('pid') || urlParams.get('PROLIFIC_PID');
  if (urlPid) {
    input.value = urlPid;
    btn.disabled = false;
  }
})();
</script>

</body>
</html>
