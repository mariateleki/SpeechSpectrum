<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpeechSpectrum Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 0;
  font-family: 'Inter', sans-serif;
  background-color: #F9FAFB;
  color: #111827;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

/* Shared card style */
.study-card {
  background: #fff;
  border-radius: 16px;
  padding: 48px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  border: 1px solid #E5E7EB;
  max-width: 520px;
  width: 100%;
  margin: 24px;
}
.study-card h1 {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0 0 8px;
  color: #111827;
  text-align: center;
}
.study-card .subtitle {
  color: #6B7280;
  font-size: 0.95rem;
  margin: 0 0 32px;
  line-height: 1.5;
  text-align: center;
}

/* Step 1: Prolific ID */
#step-pid label {
  display: block;
  text-align: left;
  font-weight: 500;
  font-size: 0.9rem;
  color: #374151;
  margin-bottom: 8px;
}
#step-pid input[type="text"] {
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid #D1D5DB;
  border-radius: 8px;
  font-size: 1rem;
  font-family: 'Inter', sans-serif;
  color: #111827;
  outline: none;
  transition: border-color 0.2s ease;
}
#step-pid input[type="text"]:focus {
  border-color: #4F46E5;
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}
.error {
  color: #DC2626;
  font-size: 0.85rem;
  margin-top: 8px;
  display: none;
}

/* Step 2: Demographics */
.demo-question {
  margin-bottom: 24px;
}
.question-text {
  font-size: 0.95rem;
  font-weight: 500;
  color: #111827;
  margin: 0 0 10px;
  line-height: 1.5;
}
.question-num {
  color: #4F46E5;
  font-weight: 600;
}
.option-label {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  margin-bottom: 4px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s ease;
}
.option-label:hover {
  background: #F3F4F6;
}
.option-label input[type="radio"] {
  accent-color: #4F46E5;
  width: 16px;
  height: 16px;
  margin: 0;
  flex-shrink: 0;
}
.option-text {
  font-size: 0.9rem;
  color: #374151;
}
textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #D1D5DB;
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  color: #111827;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s ease;
}
textarea:focus {
  border-color: #4F46E5;
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}
textarea::placeholder {
  color: #9CA3AF;
}

/* Shared button */
.btn-primary {
  width: 100%;
  padding: 14px;
  background: #4F46E5;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  margin-top: 20px;
  transition: all 0.2s ease;
}
.btn-primary:hover {
  background: #4338CA;
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
}
.btn-primary:disabled {
  background: #D1D5DB;
  cursor: not-allowed;
  box-shadow: none;
}
</style>

</head>
<body>

<div class="study-card">

  <!-- Step 1: Prolific ID -->
  <div id="step-pid">
    <h1>Welcome</h1>
    <p class="subtitle">Please enter your Prolific ID to begin.</p>

    <label for="prolific-id">Prolific ID</label>
    <input type="text" id="prolific-id" placeholder="e.g. 5f3a8b2c1d4e..." autocomplete="off" autofocus>
    <p class="error" id="error-msg">Please enter a valid Prolific ID.</p>

    <button class="btn-primary" id="pid-btn" disabled>Continue</button>
  </div>

  <!-- Step 2: Demographics -->
  <div id="step-demographics" style="display:none;">
    <h1>About You</h1>
    <p class="subtitle">Please answer a few quick questions before we begin.</p>

    <form id="demo-form"></form>

    <button class="btn-primary" id="demo-btn">Start Study</button>
  </div>

</div>

<script src="./demographics.js"></script>
<script>
(function() {
  var SHEETS_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwhr3jb8UFugRfVbtCN7xbcXjiKSOfMEajOjuqYbLv9y4DISunCVqyqNvGl1n2XJKmJ/exec';

  // 5 style-level conditions
  var styles = ['verbatim', 'non-verbatim', 'enhanced', 'bullet-points', 'demo'];
  var transcripts = ['TranscrA', 'TranscrB', 'TranscrC'];

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var pid = '';
  var assignedStyle = null;
  var transcriptOrder = null;

  // --- Step 1: Prolific ID ---
  var pidInput = document.getElementById('prolific-id');
  var pidBtn = document.getElementById('pid-btn');
  var errorMsg = document.getElementById('error-msg');

  pidInput.addEventListener('input', function() {
    pidBtn.disabled = pidInput.value.trim().length === 0;
    errorMsg.style.display = 'none';
  });

  pidInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !pidBtn.disabled) pidBtn.click();
  });

  pidBtn.addEventListener('click', function() {
    pid = pidInput.value.trim();
    if (pid.length < 5) {
      errorMsg.style.display = 'block';
      return;
    }

    // Assign style level + randomize transcript order
    var storageKey = 'ss_assignment_' + pid;
    var existing = localStorage.getItem(storageKey);
    if (existing) {
      var saved = JSON.parse(existing);
      assignedStyle = saved.style;
      transcriptOrder = saved.order;
    } else {
      assignedStyle = styles[Math.floor(Math.random() * styles.length)];
      transcriptOrder = shuffle(transcripts);
      localStorage.setItem(storageKey, JSON.stringify({ style: assignedStyle, order: transcriptOrder }));
    }

    // Show demographics step
    document.getElementById('step-pid').style.display = 'none';
    document.getElementById('step-demographics').style.display = 'block';
  });

  // --- Step 2: Demographics ---
  // Render demographic questions
  var formHtml = '';
  DEMOGRAPHICS.forEach(function(q, idx) {
    formHtml += '<div class="demo-question">';
    formHtml += '<p class="question-text"><span class="question-num">' + (idx + 1) + '.</span> ' + q.text + '</p>';

    if (q.type === 'multiple_choice') {
      q.options.forEach(function(opt) {
        var inputId = q.id + '_' + opt.replace(/\s+/g, '_').toLowerCase();
        formHtml += '<label class="option-label" for="' + inputId + '">';
        formHtml += '<input type="radio" id="' + inputId + '" name="' + q.id + '" value="' + opt + '" required>';
        formHtml += '<span class="option-text">' + opt + '</span>';
        formHtml += '</label>';
      });
    } else if (q.type === 'free_response') {
      formHtml += '<textarea name="' + q.id + '" rows="2" placeholder="Type your answer here..."></textarea>';
    }

    formHtml += '</div>';
  });
  document.getElementById('demo-form').innerHTML = formHtml;

  // Handle demographics submit
  document.getElementById('demo-btn').addEventListener('click', function() {
    var form = document.getElementById('demo-form');

    // Validate multiple choice
    var allAnswered = true;
    DEMOGRAPHICS.forEach(function(q) {
      if (q.type === 'multiple_choice') {
        if (!form.querySelector('input[name="' + q.id + '"]:checked')) allAnswered = false;
      }
    });
    if (!allAnswered) {
      alert('Please answer all multiple choice questions.');
      return;
    }

    // Log each demographic response
    DEMOGRAPHICS.forEach(function(q) {
      var response = '';
      if (q.type === 'multiple_choice') {
        var sel = form.querySelector('input[name="' + q.id + '"]:checked');
        response = sel ? sel.value : '';
      } else if (q.type === 'free_response') {
        response = form.querySelector('textarea[name="' + q.id + '"]').value.trim();
      }

      var payload = {
        timestamp: new Date().toISOString(),
        event_type: 'demographic',
        prolific_id: pid,
        assigned_condition: assignedStyle + ' / ' + transcriptOrder.map(function(t){ return t.replace('Transcr',''); }).join(','),
        question_id: q.id,
        question_text: q.text,
        response: response,
        extra: ''
      };
      navigator.sendBeacon(SHEETS_WEBHOOK_URL, JSON.stringify(payload));
    });

    // Log study start
    var startPayload = {
      timestamp: new Date().toISOString(),
      event_type: 'study_start',
      prolific_id: pid,
      assigned_condition: assignedStyle,
      question_id: '',
      question_text: '',
      response: '',
      extra: JSON.stringify({ transcript_order: transcriptOrder })
    };
    navigator.sendBeacon(SHEETS_WEBHOOK_URL, JSON.stringify(startPayload));

    // Store everything in sessionStorage
    sessionStorage.setItem('ss_prolific_id', pid);
    var conditionLabel = assignedStyle + ' / ' + transcriptOrder.map(function(t){ return t.replace('Transcr',''); }).join(',');
    sessionStorage.setItem('ss_condition', conditionLabel);
    sessionStorage.setItem('ss_transcript_order', JSON.stringify(transcriptOrder));
    sessionStorage.setItem('ss_current_step', '0');

    // Redirect to task page
    window.location.href = './task.html?pid=' + encodeURIComponent(pid);
  });

  // Auto-fill PID from URL if provided by Prolific
  var urlParams = new URLSearchParams(window.location.search);
  var urlPid = urlParams.get('pid') || urlParams.get('PROLIFIC_PID');
  if (urlPid) {
    pidInput.value = urlPid;
    pidBtn.disabled = false;
  }
})();
</script>

</body>
</html>
